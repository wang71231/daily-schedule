<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#59679f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="每日课表">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>体培课程表</title>
  <style>
    :root { --blue:#59679f; --blue-deep:#414f8b; --ink:#172039; --muted:#70798f; --line:#e2e5ee; --surface:rgba(255,255,255,.94); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 8% 0%,#e9ebf5 0,transparent 34%),radial-gradient(circle at 95% 18%,#e7f2f0 0,transparent 28%),#f6f7fa; color:var(--ink); font-family:"Microsoft YaHei",system-ui,sans-serif; }
    button,input { -webkit-tap-highlight-color:transparent; }
    .wrap { max-width:1020px; margin:0 auto; padding:26px 18px 56px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:20px; padding:26px 28px; border-radius:26px; color:white; background:linear-gradient(135deg,#6876b5 0%,#5967a1 58%,#4b588d 100%); box-shadow:0 16px 38px rgba(66,76,133,.18); }
    h1 { margin:0; font-size:30px; line-height:1.25; letter-spacing:.5px; }
    .sub { display:inline-flex; margin-top:10px; padding:5px 10px; border:1px solid rgba(255,255,255,.24); border-radius:999px; color:rgba(255,255,255,.86); background:rgba(255,255,255,.1); font-size:13px; }
    .tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .home-link { display:inline-flex; align-items:center; min-height:42px; border:1px solid rgba(255,255,255,.4); border-radius:12px; background:rgba(255,255,255,.96); color:var(--ink); padding:9px 13px; font:inherit; font-weight:600; text-decoration:none; }
    button,input { min-height:42px; border:1px solid rgba(255,255,255,.4); border-radius:12px; background:rgba(255,255,255,.96); color:var(--ink); padding:9px 13px; font:inherit; transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease; }
    button { cursor:pointer; font-weight:600; } button:hover { transform:translateY(-1px); border-color:white; box-shadow:0 7px 18px rgba(17,30,89,.16); }
    button:active { transform:translateY(0); }
    .date { min-width:152px; font-weight:700; }
    .layout { --slot-height:106px; display:grid; grid-template-columns:150px 1fr; gap:14px; padding:18px; border:1px solid rgba(220,226,243,.9); border-radius:26px; background:var(--surface); box-shadow:0 12px 34px rgba(38,52,101,.08); backdrop-filter:blur(10px); }
    .timeline { position:relative; }
    .timeline:after { content:""; position:absolute; top:14px; bottom:14px; right:13px; width:2px; background:linear-gradient(#8792bd,#d1d6e6); }
    .slot { height:var(--slot-height); text-align:right; padding-right:27px; position:relative; }
    .slot:after { content:""; position:absolute; right:7px; top:7px; width:12px; height:12px; border:3px solid #f0f1f7; background:#7480ad; border-radius:50%; z-index:1; box-shadow:0 0 0 2px rgba(116,128,173,.16); }
    .slot strong { display:block; padding-top:1px; font-size:15px; }
    .slot small { display:block; color:#65739a; margin-top:17px; font-size:12px; line-height:1.4; white-space:nowrap; }
    .cards { min-height:calc(9 * var(--slot-height)); position:relative; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:repeat(9,var(--slot-height)); }
    .course { --accent:#6877ad; --tint:#f1f3f9; grid-column:1; grid-row:var(--row-start) / var(--row-end); align-self:stretch; position:relative; padding:17px 20px 15px 24px; margin:6px 0; overflow:hidden; border:1px solid rgba(100,110,150,.14); border-radius:19px; background:linear-gradient(135deg,var(--tint) 0%,#fff 72%); box-shadow:0 7px 19px rgba(42,56,112,.065); }
    .course:before { content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--accent); }
    .course[data-code="5789"] { --accent:#806fa8; --tint:#f3f0f8; }
    .course[data-code="5784"] { --accent:#579590; --tint:#edf6f4; }
    .course[data-code="5786"] { --accent:#bd8b53; --tint:#faf4eb; }
    .course[data-code="5785"] { --accent:#6680b3; --tint:#eef2f8; }
    .course[data-code="5782"] { --accent:#63977e; --tint:#eef6f1; }
    .course[data-code="5791"] { --accent:#b87891; --tint:#f8eff3; }
    .course-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .course h2 { margin:0; min-width:0; color:var(--ink); font-size:20px; line-height:1.35; font-weight:750; overflow-wrap:anywhere; }
    .week-tag { flex:0 0 auto; padding:4px 9px; border-radius:999px; color:var(--accent); background:white; box-shadow:0 2px 8px rgba(35,48,99,.07); font-size:12px; font-weight:700; }
    .course-time { margin-top:12px; color:var(--accent); font-size:15px; font-weight:700; }
    .course-time span { margin-left:12px; color:#34405d; font-weight:600; }
    .course-details { display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:10px; color:#4f5c77; font-size:14px; overflow-wrap:anywhere; }
    .course-details b { color:#7b859d; font-weight:500; margin-right:6px; }
    .course .note { margin:10px 0 0; color:#8a94aa; font-size:12px; }
    .empty { grid-column:1; grid-row:1 / 4; align-self:start; margin-top:6px; padding:62px 20px; text-align:center; color:var(--muted); background:linear-gradient(135deg,#f7f8ff,#fff); border:1px dashed #cfd7eb; border-radius:19px; }
    .empty:before { content:"☕"; display:block; margin-bottom:10px; font-size:32px; }
    .settings { margin-top:16px; padding:15px 18px; color:var(--muted); background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:16px; font-size:13px; box-shadow:0 8px 24px rgba(38,52,101,.05); }
    .settings summary { cursor:pointer; color:var(--ink); font-weight:700; }
    .settings label { display:inline-flex; align-items:center; gap:8px; margin:14px 0 8px; }
    .settings input { border-color:#d9e0ee; }
    .worklog { margin-top:16px; padding:18px; border:1px solid rgba(220,226,243,.9); border-radius:22px; background:rgba(255,255,255,.94); box-shadow:0 10px 28px rgba(38,52,101,.06); }
    .worklog-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .worklog-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .quick-links { display:flex; gap:8px; margin:0 0 14px; }
    .quick-links a { padding:8px 12px; border:1px solid #dce1ec; border-radius:11px; background:#fff; color:var(--blue-deep); text-decoration:none; font-size:13px; font-weight:700; }
    .data-tools { margin:14px 0; padding:12px; border:1px solid #e2e6ef; border-radius:14px; background:#fafbfc; }
    .data-tools summary { cursor:pointer; font-size:14px; font-weight:700; }
    .data-tools .worklog-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    :focus-visible { outline:3px solid #7d8bc4; outline-offset:2px; }
    .worklog h2 { margin:0; font-size:19px; }
    .worklog-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .worklog-actions button { min-height:36px; padding:7px 10px; border-color:#d9dfed; font-size:13px; }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
    .summary-item { padding:10px 8px; border-radius:12px; background:#f3f4f8; text-align:center; }
    .summary-item strong { display:block; color:var(--blue-deep); font-size:18px; }
    .summary-item small { color:var(--muted); font-size:11px; }
    .rate { display:flex; align-items:center; gap:8px; margin-bottom:14px; color:var(--muted); font-size:13px; }
    .rate input { width:100px; min-height:36px; padding:6px 9px; border-color:#d9e0ee; }
    .history { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:14px; padding:10px 12px; border-radius:12px; background:#f8f8fb; color:var(--muted); font-size:13px; }
    .history input { width:100px; min-height:36px; padding:6px 9px; border:1px solid #d9e0ee; border-radius:9px; font:inherit; }
    .extra-form { margin-bottom:14px; padding:12px; border:1px solid #e2e6ef; border-radius:14px; background:#fafbfc; }
    .extra-form summary { cursor:pointer; color:var(--ink); font-size:14px; font-weight:700; }
    .extra-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
    .extra-grid label { color:var(--muted); font-size:12px; }
    .extra-grid input { width:100%; min-height:38px; margin-top:5px; padding:7px 9px; border:1px solid #d9e0ee; border-radius:9px; font:inherit; color:var(--ink); background:#fff; }
    .extra-grid .wide { grid-column:1 / -1; }
    .add-extra { grid-column:1 / -1; min-height:40px; border-color:#8e99bd; color:#fff; background:var(--blue); }
    .extra-list { margin-bottom:14px; }
    .extra-item { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:11px 12px; margin-top:8px; border-left:4px solid #8a79a9; border-radius:10px; background:#f4f1f7; }
    .extra-item strong { display:block; font-size:14px; }
    .extra-item small { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
    .delete-extra { flex:0 0 auto; min-height:32px; padding:5px 8px; border-color:#dacfd5; color:#925e70; background:#fff; font-size:12px; }
    .log-row { display:grid; grid-template-columns:minmax(0,1fr) 102px 78px; gap:9px; align-items:center; padding:12px 0; border-top:1px solid #edf0f5; }
    .log-name { min-width:0; font-weight:700; font-size:14px; }
    .log-name small { display:block; margin-top:4px; color:var(--muted); font-size:12px; font-weight:400; overflow-wrap:anywhere; }
    .log-row select,.log-row input { width:100%; min-height:36px; padding:6px 7px; border:1px solid #d9e0ee; border-radius:9px; background:#fff; color:var(--ink); font:inherit; font-size:12px; }
    .log-empty { color:var(--muted); font-size:13px; padding:10px 0 2px; }
    @media (max-width:720px){
      .wrap{padding:12px 8px 34px}
      header{display:block;padding:20px 16px;border-radius:22px;margin-bottom:12px}
      h1{font-size:25px}
      .sub{font-size:12px}
      .tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;gap:7px}
      .tools button{padding:8px 6px;font-size:13px}
      #date{grid-column:1/-1;grid-row:1;width:100%}
      #prev{grid-column:1;grid-row:2} #next{grid-column:2;grid-row:2} #today{grid-column:3;grid-row:2}
      .layout{--slot-height:124px;grid-template-columns:112px minmax(0,1fr);gap:7px;padding:12px 8px;border-radius:22px}
      .slot{padding-right:20px}.slot:after{right:1px}.timeline:after{right:7px}
      .slot strong{font-size:13px}.slot small{font-size:10px;margin-top:17px}
      .course{padding:14px 10px 12px 17px;border-radius:16px}
      .course h2{font-size:16px}.week-tag{padding:3px 7px;font-size:10px}
      .course-time{margin-top:9px;font-size:13px}.course-time span{display:block;margin:3px 0 0}
      .course-details{display:block;margin-top:7px;font-size:12px}
      .course-details span{display:block;margin-top:3px}
      .course .note{margin-top:7px;font-size:10px}
      .worklog{padding:14px 12px;border-radius:18px}.worklog-head{align-items:flex-start;display:block}.worklog-actions{margin-top:10px}
      .summary{gap:5px}.summary-item{padding:9px 4px}.summary-item strong{font-size:16px}
      .rate{flex-wrap:wrap}.log-row{grid-template-columns:minmax(0,1fr) 82px 66px;gap:6px}.log-name{font-size:13px}.log-name small{font-size:11px}
      .extra-grid{grid-template-columns:1fr}.extra-grid .wide,.add-extra{grid-column:1}
      .quick-links a{flex:1;text-align:center}
      .worklog-head{margin-bottom:14px}
      .summary-item small{font-size:12px}
      .layout:has(.empty){--slot-height:74px}
      .layout:has(.empty) .timeline .slot:nth-child(n+4){display:none}
      .layout:has(.empty) .cards{min-height:222px;grid-template-rows:repeat(3,74px)}
      .layout:has(.empty) .empty{padding:55px 12px}
    }
  </style>
  <link rel="stylesheet" href="./glass.css">
</head>
<body>
<main class="wrap">
  <header>
    <div>
  <h1 id="title">体培课程表</h1>
      <div class="sub" id="meta"></div>
    </div>
    <div class="tools">
      <a class="home-link" href="./index.html">退出课表</a>
      <button id="prev">‹ 前一天</button>
      <input class="date" id="date" type="date">
      <button id="next">后一天 ›</button>
      <button id="today">回到今天</button>
    </div>
  </header>
  <nav class="quick-links" aria-label="页面快捷入口"><a href="#schedule">查看日程</a><a href="#worklog">记录课时</a></nav>
  <section class="layout" id="schedule" aria-label="当日课程">
    <aside class="timeline" id="timeline"></aside>
    <section class="cards" id="cards"></section>
  </section>
  <section class="worklog" id="worklog">
    <div class="worklog-head"><div><h2>课时记录</h2><p>先记录当天课程，再查看累计课时</p></div></div>
    <div id="storageNotice" role="status" style="margin:0 0 12px;color:#925e70;font-size:13px"></div>
    <div class="summary" id="summary"></div>
    <div id="logRows"></div>
    <details class="extra-form"><summary>查看全部课时记录</summary><div id="allLogs"></div></details>
    <p class="rate">月工资：基础5000元（40小时），超出部分65元/小时。月内记录未满40小时也不按比例扣减；统计供结算核对。</p>
    <details class="extra-form">
      <summary>添加临时课程</summary>
      <form class="extra-grid" id="extraForm">
        <label>日期<input id="extraDate" type="date" required></label>
        <label>课程名称<input id="extraName" type="text" value="临时加课" required></label>
        <label class="wide">地点<input id="extraRoom" type="text" required></label>
        <label>开始时间<input id="extraStart" type="time" required></label>
        <label>结束时间<input id="extraEnd" type="time" required></label>
        <button class="add-extra" type="submit">保存临时课程</button>
      </form>
    </details>
    <div class="extra-list" id="extraList"></div>
    <section class="extra-form" aria-labelledby="manualTitle">
      <h2 id="manualTitle">额外课时补录</h2>
      <p class="log-empty">选择分钟或小时，填写已算好的课时，保存后计入课时和工资。已记录过的课程不要重复补录。</p>
      <form class="extra-grid" id="manualForm">
        <label>归属日期<input id="manualDate" type="date" required></label>
        <label>已算好的课时<input id="manualHours" type="number" min="0.01" step="0.01" inputmode="decimal" required></label>
        <label>单位<select id="manualUnit"><option value="hours">小时</option><option value="minutes">分钟</option></select></label><label class="wide">备注<input id="manualNote" type="text" maxlength="200" placeholder="例如：本月额外课程合计" required></label>
        <button class="add-extra" type="submit" id="manualSave">保存补录课时</button>
        <button type="button" id="manualCancel" class="wide" hidden>取消修改，添加新课时</button>
      </form>
      <div id="manualList"></div>
      <div id="manualNotice" class="log-empty" role="status"></div>
    </section>
    <details class="data-tools"><summary>导出、备份与管理数据</summary><div class="worklog-actions"><button id="exportCsv">导出 CSV</button><button id="exportBackup">备份数据</button><button id="importBackup">恢复备份</button><input id="backupFile" type="file" accept=".json,application/json" hidden><button id="viewHistory">保存历史</button><button id="importLegacy" hidden>合并旧版页面新记录</button><button id="exportRaw">导出旧版原始数据</button><button id="clearLogs">清空记录</button></div></details>
  </section>
  <details class="settings">
    <summary>课表说明</summary>
    <div>课程按图片中的具体日期和星期显示，老师均为胡翊铭。</div>
  </details>
</main>
<dialog id="historyDialog" style="width:min(600px,90vw);max-height:80vh;border:1px solid #cbd3df;border-radius:16px;padding:20px;box-sizing:border-box"><h2>保存历史</h2><p>保留最近 100 次修改前的完整记录。可先下载核对；恢复前也会留存当前版本。</p><div id="historyList"></div><button id="closeHistory">关闭</button></dialog>
<script src="./state.js"></script>
<script src="./storage.js"></script>
<script>
const slots = [
  ['上午','09:00–12:00'],['上午','09:45–10:45'],['下午','14:10–15:40'],
  ['下午','15:00–18:00'],['下午','15:30–17:00'],['下午','15:50–17:00'],
  ['下午','15:45–17:30'],['下午','16:00–17:30'],['下午','16:30–17:20']
];
const courses = [
  {day:1,start:5,name:'啦啦操进校课程',room:'嘉定江桥小学',time:'15:30–17:00',date:'2026-09-07',code:'monday'},
  {day:2,start:8,name:'啦啦操进校课程',room:'中山北路第一小学',time:'16:00–17:30',date:'2026-09-08',code:'tuesday'},
  {day:3,start:7,name:'啦啦操进校课程',room:'复旦德富路小学',time:'15:45–17:30',date:'2026-09-16',code:'wednesday'},
  {day:4,start:6,name:'啦啦操进校课程',room:'复旦徐汇实验小学',time:'15:50–17:00',date:'2026-09-17',code:'thursday'},
  {day:5,start:2,name:'俱乐部课程',room:'嘉秀幼儿园',time:'09:45–10:45',date:'2026-09-18',code:'friday-morning'},
  {day:5,start:3,name:'俱乐部课程',room:'嘉城学校二年级校队（山羊馆）',time:'14:10–15:40',date:'2026-09-18',code:'friday-afternoon'},
  {day:5,start:9,name:'俱乐部课程',room:'悦庭幼儿园（延时课）',time:'16:30–17:20',date:'2026-09-18',code:'friday-evening'},
  {day:0,start:1,name:'俱乐部课程',room:'幸城学校4–5年级校队',time:'09:00–12:00',date:'2026-09-13',code:'sunday-morning'},
  {day:0,start:4,name:'俱乐部课程',room:'体殷精英2队',time:'15:00–18:00',date:'2026-09-13',code:'sunday-afternoon'}
];
const weekNames=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const defaultStart='2026-09-07';
const $=id=>document.getElementById(id);
let selected = new Date(); selected.setHours(12,0,0,0);
let logs = {}, extraCourses = [], savedHistoryHours = '0';
let storageReady = false;
const main=document.querySelector('main');
main.inert=true;
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function parse(s){const [y,m,day]=s.split('-').map(Number);return new Date(y,m-1,day,12)}
function weekInfo(d){const start=parse(defaultStart); const diff=Math.floor((d-start)/86400000); return {week:Math.floor(diff/7)+1, valid:diff>=0};}
function active(c,d){return d>=parse(c.date);}
function hours(c){const [a,b]=c.time.split('–').map(v=>{const [h,m]=v.split(':').map(Number);return h+m/60});return +(b-a).toFixed(2);}
function logKey(c,date=iso(selected)){return `${date}|${c.code}`;}
function recordFor(c){const key=logKey(c);return logs[key]||{date:iso(selected),day:c.day,code:c.code,name:c.name,room:c.room,time:c.time,source:c.extra?'临时加课':'固定课程',status:'pending',hours:hours(c)};}
async function editState(edit,reason='编辑课时') {
  $('storageNotice').style.color='var(--muted)';
  $('storageNotice').textContent='正在保存…';
  try {
    await ScheduleStore.change(edit,reason);
    window.scheduleBackend?.queue();
    return true;
  } catch(error) {
    $('storageNotice').style.color='#925e70';
    $('storageNotice').textContent=`保存失败，原记录未改变：${error.message}。请先备份，不要清除网站数据。`;
    return false;
  }
}
function updateLog(c,change) {
  const key=logKey(c),initial=recordFor(c);
  return editState(state=>{state.logs[key]={...(state.logs[key]||initial),...change};});
}
function historyHours(){return Number(savedHistoryHours);}
function esc(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function monthlySalary(h){return h>0?5000+Math.max(0,h-40)*65:0;}
function salaryMonths(){const result={};Object.values(logs).filter(v=>v.status==='done').forEach(v=>{const m=v.date.slice(0,7);result[m]=(result[m]||0)+Number(v.hours||0);});if(historyHours()>0)result['2026-09']=(result['2026-09']||0)+historyHours();return result;}
function totals(){
  const completed=Object.values(logs).filter(v=>v.status==='done');
  const history=historyHours();
  const total=history+completed.reduce((sum,v)=>sum+Number(v.hours||0),0);
  const now=selected.getFullYear()+'-'+String(selected.getMonth()+1).padStart(2,'0');
  const month=(now==='2026-09'?history:0)+completed.filter(v=>v.date.startsWith(now)).reduce((sum,v)=>sum+Number(v.hours||0),0);
  const weekStart=new Date(selected); weekStart.setDate(selected.getDate()-((selected.getDay()+6)%7));
  const weekEnd=new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
  const week=completed.filter(v=>{const d=parse(v.date);return d>=weekStart&&d<=weekEnd}).reduce((sum,v)=>sum+Number(v.hours||0),0);
  const months=salaryMonths();
  return {total,month,week,monthPay:monthlySalary(month),pay:Object.values(months).reduce((sum,h)=>sum+monthlySalary(h),0)};
}
function resetManualForm(){delete $('manualForm').dataset.editKey;$('manualForm').reset();$('manualDate').value=iso(selected);$('manualSave').textContent='保存补录课时';$('manualCancel').hidden=true;}
function renderLog(list,preserveInput=false){
  const t=totals();
  const manual=Object.entries(logs).filter(([,v])=>v.source==='额外课时补录').sort((a,b)=>b[1].date.localeCompare(a[1].date));
  $('manualList').innerHTML=manual.map(([key,v])=>`<div class="extra-item"><div><strong>${esc(v.name)} · ${Number(v.hours).toFixed(2)} 小时</strong><small>${esc(v.date)} · 已计入统计</small></div><div class="manual-actions"><button type="button" data-manual-edit="${esc(key)}">修改</button> <button type="button" data-manual-delete="${esc(key)}">删除</button></div></div>`).join('');
  document.querySelectorAll('[data-manual-edit]').forEach(el=>el.onclick=()=>{const v=logs[el.dataset.manualEdit];$('manualForm').dataset.editKey=el.dataset.manualEdit;$('manualDate').value=v.date;$('manualUnit').value=v.inputUnit||'hours';$('manualHours').value=v.inputValue??v.hours;$('manualNote').value=v.name;$('manualSave').textContent='保存修改';$('manualCancel').hidden=false;$('manualForm').scrollIntoView({block:'center'});});
  document.querySelectorAll('[data-manual-delete]').forEach(el=>el.onclick=async()=>{const key=el.dataset.manualDelete;if(!confirm('删除这条补录课时？可在保存历史里找回。'))return;if(await editState(s=>{delete s.logs[key];},'删除补录前')){if($('manualForm').dataset.editKey===key)resetManualForm();render();}});
  $('summary').innerHTML=`<div class="summary-item"><strong>${t.week.toFixed(2)} h</strong><small>本周课时</small></div><div class="summary-item"><strong>${t.month.toFixed(2)} h</strong><small>本月课时</small></div><div class="summary-item"><strong>¥${t.monthPay.toFixed(2)}</strong><small>本月预计工资</small></div><div class="summary-item"><strong>¥${t.pay.toFixed(2)}</strong><small>累计预计工资</small></div>`;
  const all=Object.values(logs).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  $('allLogs').innerHTML=all.length?all.map(v=>`<div class="log-row"><div class="log-name">${esc(v.date)} · ${esc(v.name)}<small>${esc(v.room)} · ${esc(v.time)}</small></div><span>${esc({'done':'已完成','pending':'未记录','leave':'请假','cancel':'取消'}[v.status]||v.status)}</span><span>${Number(v.hours||0).toFixed(2)} h</span></div>`).join(''):'<div class="log-empty">尚无已保存的课时记录</div>';
  const todayExtras=extraCourses.filter(c=>c.date===iso(selected));
  $('extraList').innerHTML=todayExtras.map(c=>`<div class="extra-item"><div><strong>${esc(c.name)}</strong><small>${esc(c.time)} · ${esc(c.room)}</small></div><button class="delete-extra" data-delete="${esc(c.code)}">删除</button></div>`).join('');
  if(preserveInput)return;
  $('logRows').innerHTML=list.length?list.map(c=>{const v=recordFor(c);return `<div class="log-row"><div class="log-name">${esc(c.name)}<small>${esc(c.room)} · 计划 ${esc(c.time)} · ${hours(c).toFixed(2)} 小时${c.extra?' · 临时加课':''}</small></div><select data-log="${esc(c.code)}" class="log-status"><option value="pending" ${v.status==='pending'?'selected':''}>未记录</option><option value="done" ${v.status==='done'?'selected':''}>已完成</option><option value="leave" ${v.status==='leave'?'selected':''}>请假</option><option value="cancel" ${v.status==='cancel'?'selected':''}>取消</option></select><input data-hours="${esc(c.code)}" class="log-hours" type="number" min="0" step="0.01" value="${v.hours??hours(c)}" aria-label="实际课时"></div>`}).join(''):`<div class="log-empty">当天没有可记录的课程</div>`;
  document.querySelectorAll('.log-status').forEach(el=>el.onchange=async()=>{const c=list.find(x=>x.code===el.dataset.log);if(await updateLog(c,{status:el.value}))renderLog(list);});
  document.querySelectorAll('.log-hours').forEach(el=>{el.oninput=async()=>{if(el.value===''||!el.validity.valid)return;const c=list.find(x=>x.code===el.dataset.hours);await updateLog(c,{hours:Number(el.value)});};el.onchange=()=>renderLog(list);});
  document.querySelectorAll('.delete-extra').forEach(el=>el.onclick=async()=>{const c=extraCourses.find(x=>x.code===el.dataset.delete);if(!c||!confirm('删除这节临时课程及其课时？可在保存历史里找回。'))return;if(await editState(s=>{s.extraCourses=s.extraCourses.filter(x=>x.code!==c.code);delete s.logs[logKey(c,c.date)];},'删除临时课前'))render();});
}
function render(preserveInput=false){
  if(!$('manualDate').value)$('manualDate').value=iso(selected);
  if(!document.activeElement?.closest('#extraForm'))$('extraDate').value=iso(selected);
  $('date').value=iso(selected); const info=weekInfo(selected); const day=selected.getDay();
  const fixed=courses.filter(c=>c.day===day && active(c,selected));
  const extras=extraCourses.filter(c=>c.date===iso(selected));
  const list=[...fixed,...extras].sort((a,b)=>a.time.localeCompare(b.time));
  $('title').textContent=`${weekNames[day]} · ${selected.getMonth()+1}月${selected.getDate()}日`;
  $('meta').textContent=info.valid?`第 ${info.week} 周 · ${list.length ? `${list.length} 个课程安排` : '今天没有课程'}`:'课程开始日期之前';
  $('timeline').innerHTML=slots.map(s=>`<div class="slot"><strong>${s[0]}</strong><small>${s[1]}</small></div>`).join('');
  const fixedCards=fixed.map(c=>`<article class="course" data-code="${esc(c.code)}" style="--row-start:${c.start};--row-end:${c.start+1}"><div class="course-head"><h2>${c.name}</h2><span class="week-tag">${weekNames[c.day]}</span></div><div class="course-time">${c.time}</div><div class="course-details"><span><b>地点</b>${c.room}</span><span><b>老师</b>胡翊铭</span></div></article>`).join('');
  const extraCards=extras.map((c,i)=>`<article class="course extra-course" data-code="${esc(c.code)}" style="--row-start:${10+i};--row-end:${11+i}"><div class="course-head"><h2>${esc(c.name)}</h2><span class="week-tag">临时</span></div><div class="course-time">${c.time}</div><div class="course-details"><span><b>地点</b>${esc(c.room)}</span><span><b>类型</b>临时加课</span></div></article>`).join('');
  $('cards').innerHTML=(fixedCards+extraCards)||`<div class="empty">今天没有安排课程</div>`;
  renderLog(list,preserveInput);
}
$('date').addEventListener('change',e=>{selected=parse(e.target.value);render()});
$('prev').onclick=()=>{selected.setDate(selected.getDate()-1);render()}; $('next').onclick=()=>{selected.setDate(selected.getDate()+1);render()}; $('today').onclick=()=>{selected=new Date();selected.setHours(12,0,0,0);render()};
 $('manualCancel').onclick=()=>{resetManualForm();$('manualNotice').textContent='';};
$('manualForm').onsubmit=async e=>{
  e.preventDefault();
  const date=$('manualDate').value,inputValue=Number($('manualHours').value),inputUnit=$('manualUnit').value;
  const h=inputUnit==='minutes'?inputValue/60:inputValue,note=$('manualNote').value.trim(),oldKey=$('manualForm').dataset.editKey;
  if(!date||!Number.isFinite(h)||h<=0||!note)return;
  $('manualSave').disabled=true;
  const ok=await editState(s=>{
    const code=oldKey?s.logs[oldKey]?.code:'manual-'+crypto.randomUUID();
    if(!code)throw Error('这条记录已在其他页面删除，请重新载入');
    if(oldKey)delete s.logs[oldKey];
    s.logs[date+'|'+code]={date,day:parse(date).getDay(),code,name:note,room:'手动补录',time:'已计算课时',source:'额外课时补录',status:'done',hours:h,inputUnit,inputValue};
  },oldKey?'修改补录前':'新增补录前');
  $('manualSave').disabled=false;
  if(ok){resetManualForm();render();$('manualNotice').textContent='补录已保存，已计入课时和工资统计。';}
};
$('extraDate').value=iso(selected);
$('extraForm').onsubmit=async e=>{
  e.preventDefault();
  const date=$('extraDate').value,start=$('extraStart').value,end=$('extraEnd').value;
  if(!date||!start||!end)return;
  if(end<=start){alert('结束时间必须晚于开始时间');return;}
  const c={day:parse(date).getDay(),name:$('extraName').value.trim(),room:$('extraRoom').value.trim(),time:`${start}–${end}`,date,code:'extra-'+crypto.randomUUID(),extra:true};
  const button=$('extraForm').querySelector('button');button.disabled=true;
  const ok=await editState(s=>{s.extraCourses.push(c);},'新增临时课前');button.disabled=false;
  if(ok){selected=parse(date);$('extraForm').reset();$('extraName').value='临时加课';$('extraDate').value=date;render();}
};
$('clearLogs').onclick=async()=>{
  if(!confirm('清空全部课时记录？临时课程和历史课时总数保留。清空前会自动保存一个历史版本。'))return;
  await editState(s=>{s.logs={};},'清空记录前');
};
function downloadFile(name,content,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function exportState(state,label='体培课时备份'){downloadFile(`${label}-${iso(new Date())}.json`,JSON.stringify(ScheduleData.backup(state),null,2),'application/json');}
$('exportBackup').onclick=async()=>{try{exportState((await ScheduleStore.refresh()).state);}catch(error){alert(error.message);}};
window.addEventListener('schedule-legacy-changed',()=>{
  $('importLegacy').hidden=false;
  $('storageNotice').textContent='检测到旧版页面的记录有变化。请关闭旧版页面，再在数据管理中“合并旧版页面新记录”；旧记录仍保留。';
});
$('importLegacy').onclick=async()=>{
  if(!confirm('补入旧版页面中新增加的记录？重复项保留当前内容，旧版完整数据另存为历史版本。'))return;
  try{await ScheduleStore.importLegacy();window.scheduleBackend?.queue();$('importLegacy').hidden=true;}
  catch(error){alert(`合并未完成：${error.message}。请先导出旧版原始数据。`);}
};
$('exportRaw').onclick=()=>{downloadFile(`旧版课时原始数据-${iso(new Date())}.json`,JSON.stringify(ScheduleStore.rawLegacy(),null,2),'application/json');};
$('importBackup').onclick=()=>$('backupFile').click();
$('backupFile').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    if(file.size>2*1024*1024)throw Error('备份文件超过2MB');
    const incoming=ScheduleData.fromBackup(JSON.parse(await file.text()));
    if(!confirm(`导入 ${Object.keys(incoming.logs).length} 条课时记录？只补入缺少的记录，同一条记录保留当前内容；导入前自动留存历史。`))return;
    const ok=await editState(s=>{
      s.logs={...incoming.logs,...s.logs};
      s.extraCourses=[...new Map([...incoming.extraCourses,...s.extraCourses].map(c=>[c.code,c])).values()];
      // A partial backup with absent/zero totals must not erase existing totals.
      if(Number(s.historyHours)===0)s.historyHours=incoming.historyHours;
      if(Number(s.trainingRate)===0)s.trainingRate=incoming.trainingRate;
    },'导入备份前');
    if(ok)alert('备份已合并；重复记录保留当前内容。可在保存历史中下载合并前的数据。');
  }catch(error){alert(`恢复失败：${error.message}`);}finally{e.target.value='';}
};
$('closeHistory').onclick=()=>$('historyDialog').close();
$('viewHistory').onclick=async()=>{
  try{
    const snapshots=await ScheduleStore.history();
    $('historyList').replaceChildren();
    if(!snapshots.length)$('historyList').textContent='尚无历史版本。每次改动会自动留存修改前的数据。';
    for(const snapshot of snapshots){
      const row=document.createElement('div');row.style.cssText='border-top:1px solid #dce3e9;padding:12px 0';
      const label=document.createElement('p');label.textContent=`${new Date(snapshot.at).toLocaleString()} · ${snapshot.reason} · ${Object.keys(snapshot.state.logs).length} 条课时`;
      const download=document.createElement('button');download.textContent='下载';download.onclick=()=>exportState(snapshot.state,'课时历史-'+snapshot.id);
      const restore=document.createElement('button');restore.textContent='恢复此版本';restore.style.marginLeft='8px';
      restore.onclick=async()=>{
        if(!confirm('将课时、临时课程和历史总数恢复为此版本？当前完整数据会先存入保存历史。'))return;
        if(await editState(s=>Object.assign(s,structuredClone(snapshot.state)),'恢复历史前'))$('historyDialog').close();
      };
      row.append(label,download,restore);$('historyList').append(row);
    }
    $('historyDialog').showModal();
  }catch(error){alert(error.message);}
};
window.addEventListener('schedule-data',e=>{
  const doc=e.detail;logs=doc.state.logs;extraCourses=doc.state.extraCourses;savedHistoryHours=doc.state.historyHours;
  render(document.activeElement?.matches('.log-hours'));
  $('storageNotice').style.color='var(--muted)';
  $('storageNotice').textContent=window.SERVER_MODE?'本机副本已保存；同步状态见上方。':`仅本机保存 · ${new Date(doc.updatedAt).toLocaleString()}。换设备或清理浏览器前，请下载 JSON 备份。`;
});
ScheduleStore.ready.then(()=>{storageReady=true;main.inert=false;}).catch(error=>{
  main.inert=false;
  document.querySelectorAll('form input,form select,form button,.log-hours,.log-status,#clearLogs,#importBackup,#exportBackup,#viewHistory').forEach(el=>el.disabled=true);
  $('storageNotice').textContent=`无法读取记录，已暂停写入：${error.message}。旧数据保留，请点“导出旧版原始数据”，不要清理浏览器。`;
});
$('exportCsv').onclick=()=>{const rows=[['日期','星期','课程','地点','计划时间','来源','状态','实际课时','月结工资（仅月汇总行）']];if(historyHours()>0)rows.push(['2026-09-14','星期一','9月15日前历史课时','手动补录','—','历史补录','已完成',historyHours(),'']);Object.values(logs).sort((a,b)=>a.date.localeCompare(b.date)).forEach(v=>rows.push([v.date,weekNames[v.day],v.name,v.room,v.time,v.source||'固定课程',v.status,Number(v.hours||0),'']));Object.entries(salaryMonths()).sort().forEach(([m,h])=>rows.push([m,'','月度工资汇总','','','月结','',h,monthlySalary(h).toFixed(2)]));const csv='\uFEFF'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='体培课时记录.csv';a.click();URL.revokeObjectURL(a.href);};

render();
if(!window.SERVER_MODE && 'serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
