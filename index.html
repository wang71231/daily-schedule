<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#59679f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="我的课表">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>我的课表</title>
  <style>
    :root{--ink:#172039;--muted:#70798f;--line:#e2e5ee}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f6f7fa;color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}
    main{max-width:680px;margin:0 auto;padding:28px 18px}
    header{padding:26px 24px;border-radius:22px;color:white;background:linear-gradient(135deg,#6876b5,#4b588d);box-shadow:0 14px 30px rgba(66,76,133,.16)}
    h1{margin:0;font-size:28px}
    p{margin:9px 0 0;color:rgba(255,255,255,.82)}
    .links{display:grid;gap:14px;margin-top:18px}
    a{display:block;padding:21px 22px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 7px 20px rgba(38,52,101,.07)}
    a:hover{border-color:#9da8c8}
    strong{display:block;font-size:18px}
    span{display:block;margin-top:6px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <main>
    <header><h1>我的课表</h1><p>选择要查看的课程安排</p></header>
    <section class="links">
      <a href="./university.html"><strong>大学课程表</strong><span>按教学周和第几节查看</span></a>
      <a href="./training.html"><strong>体培课程表</strong><span>按实际时间查看 2026 下半年安排</span></a>
    </section>
  </main>
</body>
</html>
