<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#59679f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="每日课表">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>我的每日课表</title>
  <style>
    :root { --blue:#59679f; --blue-deep:#414f8b; --ink:#172039; --muted:#70798f; --line:#e2e5ee; --surface:rgba(255,255,255,.94); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 8% 0%,#e9ebf5 0,transparent 34%),radial-gradient(circle at 95% 18%,#e7f2f0 0,transparent 28%),#f6f7fa; color:var(--ink); font-family:"Microsoft YaHei",system-ui,sans-serif; }
    button,input { -webkit-tap-highlight-color:transparent; }
    .wrap { max-width:1020px; margin:0 auto; padding:26px 18px 56px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:20px; padding:26px 28px; border-radius:26px; color:white; background:linear-gradient(135deg,#6876b5 0%,#5967a1 58%,#4b588d 100%); box-shadow:0 16px 38px rgba(66,76,133,.18); }
    h1 { margin:0; font-size:30px; line-height:1.25; letter-spacing:.5px; }
    .sub { display:inline-flex; margin-top:10px; padding:5px 10px; border:1px solid rgba(255,255,255,.24); border-radius:999px; color:rgba(255,255,255,.86); background:rgba(255,255,255,.1); font-size:13px; }
    .tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    button,input { min-height:42px; border:1px solid rgba(255,255,255,.4); border-radius:12px; background:rgba(255,255,255,.96); color:var(--ink); padding:9px 13px; font:inherit; transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease; }
    button { cursor:pointer; font-weight:600; } button:hover { transform:translateY(-1px); border-color:white; box-shadow:0 7px 18px rgba(17,30,89,.16); }
    button:active { transform:translateY(0); }
    .date { min-width:152px; font-weight:700; }
    .layout { --slot-height:112px; display:grid; grid-template-columns:118px 1fr; gap:14px; padding:18px; border:1px solid rgba(220,226,243,.9); border-radius:26px; background:var(--surface); box-shadow:0 12px 34px rgba(38,52,101,.08); backdrop-filter:blur(10px); }
    .timeline { position:relative; }
    .timeline:after { content:""; position:absolute; top:14px; bottom:14px; right:13px; width:2px; background:linear-gradient(#8792bd,#d1d6e6); }
    .slot { height:var(--slot-height); text-align:right; padding-right:27px; position:relative; }
    .slot:after { content:""; position:absolute; right:7px; top:7px; width:12px; height:12px; border:3px solid #f0f1f7; background:#7480ad; border-radius:50%; z-index:1; box-shadow:0 0 0 2px rgba(116,128,173,.16); }
    .slot strong { display:block; padding-top:1px; font-size:15px; }
    .slot small { display:block; color:#65739a; margin-top:23px; font-size:12px; line-height:1.4; }
    .cards { min-height:calc(8 * var(--slot-height)); position:relative; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:repeat(8,var(--slot-height)); }
    .course { --accent:#6877ad; --tint:#f1f3f9; grid-column:1; grid-row:var(--row-start) / var(--row-end); align-self:stretch; position:relative; padding:17px 20px 15px 24px; margin:6px 0; overflow:hidden; border:1px solid rgba(100,110,150,.14); border-radius:19px; background:linear-gradient(135deg,var(--tint) 0%,#fff 72%); box-shadow:0 7px 19px rgba(42,56,112,.065); }
    .course:before { content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--accent); }
    .course[data-code="5789"] { --accent:#806fa8; --tint:#f3f0f8; }
    .course[data-code="5784"] { --accent:#579590; --tint:#edf6f4; }
    .course[data-code="5786"] { --accent:#bd8b53; --tint:#faf4eb; }
    .course[data-code="5785"] { --accent:#6680b3; --tint:#eef2f8; }
    .course[data-code="5782"] { --accent:#63977e; --tint:#eef6f1; }
    .course[data-code="5791"] { --accent:#b87891; --tint:#f8eff3; }
    .course-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .course h2 { margin:0; color:var(--ink); font-size:20px; line-height:1.35; font-weight:750; }
    .week-tag { flex:0 0 auto; padding:4px 9px; border-radius:999px; color:var(--accent); background:white; box-shadow:0 2px 8px rgba(35,48,99,.07); font-size:12px; font-weight:700; }
    .course-time { margin-top:12px; color:var(--accent); font-size:15px; font-weight:700; }
    .course-time span { margin-left:12px; color:#34405d; font-weight:600; }
    .course-details { display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:10px; color:#4f5c77; font-size:14px; }
    .course-details b { color:#7b859d; font-weight:500; margin-right:6px; }
    .course .note { margin:10px 0 0; color:#8a94aa; font-size:12px; }
    .empty { grid-column:1; grid-row:1 / 4; align-self:start; margin-top:6px; padding:62px 20px; text-align:center; color:var(--muted); background:linear-gradient(135deg,#f7f8ff,#fff); border:1px dashed #cfd7eb; border-radius:19px; }
    .empty:before { content:"☕"; display:block; margin-bottom:10px; font-size:32px; }
    .settings { margin-top:16px; padding:15px 18px; color:var(--muted); background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:16px; font-size:13px; box-shadow:0 8px 24px rgba(38,52,101,.05); }
    .settings summary { cursor:pointer; color:var(--ink); font-weight:700; }
    .settings label { display:inline-flex; align-items:center; gap:8px; margin:14px 0 8px; }
    .settings input { border-color:#d9e0ee; }
    @media (max-width:720px){
      .wrap{padding:12px 8px 34px}
      header{display:block;padding:20px 16px;border-radius:22px;margin-bottom:12px}
      h1{font-size:25px}
      .sub{font-size:12px}
      .tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;gap:7px}
      .tools button{padding:8px 6px;font-size:13px}
      #date{grid-column:1/-1;grid-row:1;width:100%}
      #prev{grid-column:1;grid-row:2} #next{grid-column:2;grid-row:2} #today{grid-column:3;grid-row:2}
      .layout{--slot-height:118px;grid-template-columns:78px 1fr;gap:7px;padding:12px 8px;border-radius:22px}
      .slot{padding-right:20px}.slot:after{right:1px}.timeline:after{right:7px}
      .slot strong{font-size:13px}.slot small{font-size:10px;margin-top:23px}
      .course{padding:14px 12px 12px 17px;border-radius:16px}
      .course h2{font-size:17px}.week-tag{padding:3px 7px;font-size:10px}
      .course-time{margin-top:9px;font-size:13px}.course-time span{display:block;margin:3px 0 0}
      .course-details{gap:5px 12px;margin-top:7px;font-size:12px}
      .course .note{margin-top:7px;font-size:10px}
    }
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1 id="title">我的每日课表</h1>
      <div class="sub" id="meta"></div>
    </div>
    <div class="tools">
      <button id="prev">‹ 前一天</button>
      <input class="date" id="date" type="date">
      <button id="next">后一天 ›</button>
      <button id="today">回到今天</button>
    </div>
  </header>
  <section class="layout">
    <aside class="timeline" id="timeline"></aside>
    <section class="cards" id="cards"></section>
  </section>
  <details class="settings">
    <summary>课表设置</summary>
    <label>学期第 1 周开始日期：<input id="semesterStart" type="date"></label>
    <div>你的课表来自 2026—2027 学年第 1 学期。修改后会自动保存到本机浏览器。</div>
  </details>
</main>
<script>
const slots = [
  ['第1节','08:20–09:05'],['第2节','09:05–09:50'],['第3节','10:05–10:50'],['第4节','10:50–11:35'],
  ['第5节','12:45–13:30'],['第6节','13:30–14:15'],['第7节','14:30–15:15'],['第8节','15:15–16:00']
];
const courses = [
  {day:1,start:3,end:4,name:'创新创业综合实践',weekStart:1,weekEnd:1,parity:'all',weeks:'第1周',teacher:'李敬磊',room:'三教120',code:'5789'},
  {day:1,start:5,end:6,name:'创新创业综合实践',weekStart:1,weekEnd:1,parity:'all',weeks:'第1周',teacher:'李敬磊',room:'信息312',code:'5789'},
  {day:1,start:5,end:6,name:'数据库应用系统实践',weekStart:9,weekEnd:12,parity:'all',weeks:'第9–12周',teacher:'张文菊',room:'计算中心130',code:'5784'},
  {day:1,start:7,end:8,name:'数据库应用系统实践',weekStart:9,weekEnd:12,parity:'all',weeks:'第9–12周',teacher:'张文菊',room:'计算中心222',code:'5784'},
  {day:1,start:5,end:8,name:'智能创新专题1',weekStart:17,weekEnd:18,parity:'all',weeks:'第17–18周',teacher:'展召敏',room:'校内实践–分散实践',code:'5786'},
  {day:2,start:3,end:4,name:'创新创业综合实践',weekStart:1,weekEnd:1,parity:'all',weeks:'第1周',teacher:'李敬磊',room:'信息312',code:'5789'},
  {day:2,start:5,end:8,name:'创新创业综合实践',weekStart:1,weekEnd:1,parity:'all',weeks:'第1周',teacher:'李敬磊',room:'计算中心415',code:'5789'},
  {day:2,start:5,end:8,name:'智能创新专题1',weekStart:17,weekEnd:18,parity:'all',weeks:'第17–18周',teacher:'展召敏',room:'校内实践–分散实践',code:'5786'},
  {day:3,start:1,end:2,name:'鸿蒙操作系统',weekStart:1,weekEnd:16,parity:'all',weeks:'第1–16周',teacher:'戴志晃',room:'信息410',code:'5785'},
  {day:3,start:3,end:4,name:'鸿蒙操作系统',weekStart:1,weekEnd:15,parity:'odd',weeks:'第1–15周（单周）',teacher:'戴志晃',room:'信息410',code:'5785'},
  {day:3,start:5,end:6,name:'嵌入式操作系统',weekStart:1,weekEnd:15,parity:'odd',weeks:'第1–15周（单周）',teacher:'程涛',room:'信息310',code:'5782'},
  {day:3,start:7,end:8,name:'创新创业综合实践',weekStart:1,weekEnd:1,parity:'all',weeks:'第1周',teacher:'李敬磊',room:'信息320',code:'5789'},
  {day:4,start:1,end:2,name:'人工智能概论',weekStart:2,weekEnd:16,parity:'even',weeks:'第2–16周（双周）',teacher:'张鹿鸣',room:'一教104',code:'5791'},
  {day:4,start:3,end:4,name:'人工智能概论',weekStart:1,weekEnd:15,parity:'odd',weeks:'第1–15周（单周）',teacher:'张鹿鸣',room:'信息312',code:'5791'},
  {day:4,start:5,end:6,name:'创新创业综合实践',weekStart:1,weekEnd:1,parity:'all',weeks:'第1周',teacher:'李敬磊',room:'信息312',code:'5789'},
  {day:5,start:3,end:4,name:'创新创业综合实践',weekStart:1,weekEnd:1,parity:'all',weeks:'第1周',teacher:'李敬磊',room:'信息405',code:'5789'},
  {day:5,start:5,end:6,name:'嵌入式操作系统',weekStart:1,weekEnd:16,parity:'all',weeks:'第1–16周',teacher:'程涛',room:'信息310',code:'5782'}
];
const weekNames=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const defaultStart='2026-09-07';
const $=id=>document.getElementById(id);
let selected = new Date(); selected.setHours(12,0,0,0);
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function parse(s){const [y,m,day]=s.split('-').map(Number);return new Date(y,m-1,day,12)}
function weekInfo(d){const start=parse(localStorage.semesterStart||defaultStart); const diff=Math.floor((d-start)/86400000); return {week:Math.floor(diff/7)+1, valid:diff>=0};}
function active(c,info){
  if(!info.valid||info.week<c.weekStart||info.week>c.weekEnd)return false;
  if(c.parity==='odd')return info.week%2===1;
  if(c.parity==='even')return info.week%2===0;
  return true;
}
function courseTime(c){return `${slots[c.start-1][1].split('–')[0]}–${slots[c.end-1][1].split('–')[1]}`;}
function render(){
  $('date').value=iso(selected); const info=weekInfo(selected); const day=selected.getDay();
  const list=courses.filter(c=>c.day===day && active(c,info));
  $('title').textContent=`${weekNames[day]} · ${selected.getMonth()+1}月${selected.getDate()}日`;
  $('meta').textContent=info.valid?`第 ${info.week} 周 · ${list.length ? `${list.length} 个课程安排` : '今天没有课程'}`:'学期开始日期之前';
  $('timeline').innerHTML=slots.map(s=>`<div class="slot"><strong>${s[0]}</strong><small>${s[1]}</small></div>`).join('');
  $('cards').innerHTML=list.length?list.map(c=>`<article class="course" data-code="${c.code}" style="--row-start:${c.start};--row-end:${c.end+1}"><div class="course-head"><h2>${c.name}</h2><span class="week-tag">${c.weeks}</span></div><div class="course-time">第${c.start}–${c.end}节<span>${courseTime(c)}</span></div><div class="course-details"><span><b>地点</b>${c.room}</span><span><b>教师</b>${c.teacher}</span></div><p class="note">课程号 ${c.code} · 计科B24-1</p></article>`).join(''):`<div class="empty">今天没有安排课程</div>`;
}
$('date').addEventListener('change',e=>{selected=parse(e.target.value);render()});
$('prev').onclick=()=>{selected.setDate(selected.getDate()-1);render()}; $('next').onclick=()=>{selected.setDate(selected.getDate()+1);render()}; $('today').onclick=()=>{selected=new Date();selected.setHours(12,0,0,0);render()};
$('semesterStart').value=localStorage.semesterStart||defaultStart; $('semesterStart').onchange=e=>{localStorage.semesterStart=e.target.value;render()};
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
