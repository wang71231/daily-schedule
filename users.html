<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理</title>
<style>body{margin:0;color:#263343;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:480px;margin:36px auto;padding:22px}header{padding:22px;border-radius:22px}h1{margin:0;font-size:25px}form{padding:22px;margin-top:18px;border-radius:18px;background:#ffffffbb}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #dce3e9;border-radius:12px;font:inherit}input{margin-top:7px}button{background:#62758c;color:white;cursor:pointer}p{font-size:14px;line-height:1.6}a{color:#465c74}#notice{min-height:24px}</style><link rel="stylesheet" href="./glass.css"></head>
<body><main><header><a href="/">返回首页</a><h1>用户管理</h1><p>修改共享登录密码。修改后所有设备需要重新登录，课时记录保留。</p></header>
<form id="passwordForm"><label>原密码<input id="oldPassword" type="password" autocomplete="current-password" required></label><label>新密码<input id="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></label><label>再次输入新密码<input id="confirmPassword" type="password" autocomplete="new-password" required></label><p>新密码至少6个字符。修改后，其他设备需要重新登录。</p><button id="save">修改密码</button><p id="notice" role="status"></p></form></main>
<script>
document.getElementById('passwordForm').onsubmit=async e=>{e.preventDefault();const $=id=>document.getElementById(id);if($('newPassword').value!==$('confirmPassword').value){$('notice').textContent='两次新密码不一致';return;}$('save').disabled=true;try{const s=await fetch('/api/state');if(s.status===401){location.href='/login';return;}if(!s.ok)throw Error('无法验证登录状态');const state=await s.json();const r=await fetch('/api/password',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':state.csrf},body:JSON.stringify({oldPassword:$('oldPassword').value,newPassword:$('newPassword').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'修改失败');alert('密码已修改，请使用新密码重新登录');location.href='/login';}catch(err){$('notice').textContent=err.message;}finally{$('save').disabled=false;}};
</script></body></html>
